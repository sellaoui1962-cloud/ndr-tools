name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir proj
          unzip -q "$(ls *.zip | head -n1)" -d proj
          DIR=$(dirname "$(find proj -maxdepth 2 -name settings.gradle | head -n1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" NDR-Tools.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NDR-Tools-apk
          path: NDR-Tools.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NDR TOOLS build ${{ github.run_number }}
          files: NDR-Tools.apk
